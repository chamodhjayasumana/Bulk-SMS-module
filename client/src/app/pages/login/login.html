<div class="login-shell">
  <form class="login-panel" (ngSubmit)="submit()">
    <p class="brand">Bulk SMS</p>
    <h1>Sign in</h1>
    <p class="hint">Authorized users only. SMS credentials never appear in this app.</p>

    <label>
      Username
      <input [(ngModel)]="username" name="username" autocomplete="username" required />
    </label>

    <label>
      Password
      <input [(ngModel)]="password" name="password" type="password" autocomplete="current-password" required />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
